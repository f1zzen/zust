[package]
name = "zust"
version = "2.1.0"
description = "Zapret, based on rUST."
authors = ["f1zzen"]
edition = "2024"

[lib]
name = "zust_lib"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = ["tray-icon", "image"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-single-instance = "2.4.0"
zust-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[features]
# devtools в релизе включаются только явно: cargo tauri build --features devtools
devtools = ["tauri/devtools"]
