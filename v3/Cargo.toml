[package]
name = "zust-v3"
version = "3.0.1"
edition = "2024"
description = "Zust v3 - интерфейс на Slint поверх zust-core"

[dependencies]
slint = { version = "1.18", features = ["unstable-fontique-011"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zust-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures = "0.3"
url = "2"
# открыть ссылку в браузере / Telegram
open = "5"
# выбор файлов (.bat) - системный диалог: xdg-portal на Linux, родной на Windows
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# системные уведомления, когда окно в трее
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSString"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# cargo run --release --features shots --bin shots - снимки всех тем в PNG (для проверки)
shots = ["dep:image"]

[[bin]]
name = "shots"
required-features = ["shots"]
